name: Market tick

# Scheduler esterno per api/cron/tick.ts: Vercel Cron gratuito gira al massimo una volta
# al giorno, troppo poco per controllare i prezzi ogni minuto durante il mercato.
# Finestra 13-21 UTC copre l'orario NYSE (9:30-16:00 ET) sia in EDT che in EST; la funzione
# stessa verifica il market clock reale e non fa nulla fuori orario.
#
# Cadenza a 5 minuti: coincide con la granularità delle barre usate per RSI/VWAP (sotto i
# 5 minuti non c'è comunque nuova informazione dai dati). GitHub esegue gli schedule sotto
# i 5 minuti "a impegno migliore" (esecuzioni che possono slittare parecchio, osservato in
# pratica su intervalli di 15-40 minuti anche a questa cadenza) — per questo cron-job.org
# (esterno, stesso TICK_SECRET) è il chiamante primario con cadenza reale di 5 minuti.
# Questo schedule resta attivo come backup ridondante: se le due chiamate cadono a meno di
# 60s l'una dall'altra, il guard anti-overlap in tick.ts ne rifiuta una con HTTP 429 — atteso
# e innocuo (vedi step sotto), non un errore. Repo pubblico = minuti Actions illimitati,
# quindi nessun vincolo di costo nel tenerlo comunque attivo.
on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch: {}

# Impedisce a due esecuzioni di girare in parallelo (es. un run manuale mentre quello
# automatico è già in corso) — tick.ts non ha transazioni né lock a livello di database,
# quindi due esecuzioni sovrapposte potrebbero leggere lo stesso stato "aperto" e decidere
# entrambe di aprire la stessa posizione. cancel-in-progress: false mette in coda la nuova
# esecuzione invece di interrompere a metà quella in corso (che lascerebbe scritture
# parziali) — se un'altra arriva nel frattempo, sostituisce quella in coda, non si accumula.
concurrency:
  group: market-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call tick endpoint
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.TICK_SECRET }}" \
            https://whad-trading.vercel.app/api/cron/tick)
          echo "HTTP $status"
          cat response.json
          if [ "$status" -eq 429 ]; then
            echo "429 atteso: cron-job.org (chiamante primario, stessa cadenza di 5 min) è arrivato entro 60s — non è un errore, questo schedule è solo un backup ridondante."
            exit 0
          fi
          if [ "$status" -ge 300 ]; then
            exit 1
          fi
