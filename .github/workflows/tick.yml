name: Market tick

# Scheduler esterno per api/cron/tick.ts: Vercel Cron gratuito gira al massimo una volta
# al giorno, troppo poco per controllare i prezzi ogni minuto durante il mercato.
# Finestra 13-21 UTC copre l'orario NYSE (9:30-16:00 ET) sia in EDT che in EST; la funzione
# stessa verifica il market clock reale e non fa nulla fuori orario.
#
# Cadenza a 5 minuti: coincide con la granularità delle barre usate per RSI/VWAP (sotto i
# 5 minuti non c'è comunque nuova informazione dai dati), ed è la soglia sotto la quale
# GitHub esegue gli schedule "a impegno migliore" (esecuzioni che possono slittare o
# saltare). Repo pubblico = minuti Actions illimitati, quindi nessun vincolo di costo qui.
on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call tick endpoint
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.TICK_SECRET }}" \
            https://whad-trading.vercel.app/api/cron/tick)
          echo "HTTP $status"
          cat response.json
          if [ "$status" -ge 300 ]; then
            exit 1
          fi
