name: Strategy monitor

# Controllo di sanità sui tre laboratori ogni 30 minuti in orario di mercato — verifica
# come si stanno comportando le tre strategie (posizioni oltre i limiti, gambe orfane nel
# pairs trading, tick fermo, valori non validi) e segnala il risultato tramite l'esito del
# run stesso (fallito = anomalie trovate) finché non viene collegato l'invio email.
#
# Stessa finestra oraria di tick.yml (13-21 UTC copre l'orario NYSE sia in EDT sia in EST);
# lo script verifica da solo il vero orologio di mercato ed esce subito se è chiuso.
on:
  schedule:
    - cron: "*/30 13-21 * * 1-5"
  workflow_dispatch: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run monitor
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_ENV: ${{ secrets.ALPACA_ENV }}
